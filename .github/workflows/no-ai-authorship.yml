# Guardrail: commits must be authored solely by the maintainer. Rejects (a) any
# AI assistant authorship/co-author trailer (Claude, ChatGPT/OpenAI, Copilot,
# Gemini, Cursor, Codeium) and (b) any automation-bot author (Renovate,
# Dependabot, github-actions, or any *[bot] identity). Scans the full PR range.
name: No AI authorship
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  scan-authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI / bot authorship and co-author trailers
        run: |
          set -e
          BASE="${{ github.base_ref }}"; BEFORE="${{ github.event.before }}"
          if [ -n "$BASE" ]; then git fetch -q origin "$BASE"; RANGE="origin/$BASE...HEAD"
          elif [ -n "$BEFORE" ] && git rev-parse "$BEFORE" >/dev/null 2>&1; then RANGE="$BEFORE..${{ github.sha }}"
          else RANGE="HEAD~1..HEAD"; fi
          AI='anthropic\.com|openai\.com|noreply@anthropic|(^|[^a-z])(claude|chatgpt|copilot|codeium|cursor ai)([^a-z]|$)|github-copilot'
          if git log "$RANGE" --format='%an <%ae>%n%cn <%ce>' | grep -Ei "$AI"; then
            echo "::error::AI assistant/provider identity in author/committer."; exit 1; fi
          BOT='\[bot\]|(^|[^a-z])(renovate|dependabot)([^a-z]|$)|renovatebot|@renovate|@dependabot|github-actions'
          if git log "$RANGE" --format='%an <%ae>' | grep -Ei "$BOT"; then
            echo "::error::Commit authored by an automation bot."; exit 1; fi
          TRAILER='co-authored-by:[[:space:]]*(claude|anthropic|openai|chatgpt|gpt-|copilot|gemini|bard|cursor|codeium|renovate|dependabot)|generated with[[:space:]]+(\[?claude|chatgpt|openai|copilot|gemini|cursor|codeium)|noreply@anthropic|anthropic\.com|openai\.com'
          if git log "$RANGE" --format='%B' | grep -Ei "$TRAILER"; then
            echo "::error::AI/bot co-author or generated-with trailer."; exit 1; fi
          echo "Clean — no AI/bot authorship or co-author metadata."
